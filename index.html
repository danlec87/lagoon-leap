:root {
  /* layout: one screen. The pixel stage fills the page; on a phone held upright a thumb deck sits under it, held sideways the deck floats over it. */
  --ink: #071320;
  --abyss: #0c2233;
  --tide: #1b5a66;
  --tide-deep: #0d3540;
  --foam: #c9f7ee;
  --coral: #ff86ab;
  --coral-deep: #b83a6b;
  --sun: #ffd95a;
  --display: "Silkscreen", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --screen-h: 60%;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ink);
  color: var(--foam);
  font-family: var(--display);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
#app {
  height: 100%;
  position: relative;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#screen {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--ink);
}
body.portrait #screen { flex: 0 0 auto; }
canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #39aee6;
  outline: none;
  touch-action: none;
}
canvas:focus-visible { outline: 2px solid var(--sun); outline-offset: -2px; }

#sys {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 8px);
  right: calc(env(safe-area-inset-right) + 8px);
  display: flex;
  gap: 8px;
  z-index: 3;
}
body.portrait #sys { top: calc(env(safe-area-inset-top) + var(--screen-h) + 12px); right: calc(env(safe-area-inset-right) + 14px); }
#sys button {
  width: 42px;
  height: 42px;
  padding: 0;
  display: grid;
  place-items: center;

        if (p.x + p.w > e.x + 1 && p.x < e.x + e.w - 1 && pb <= e.py + 2.5 && p.y + p.h >= e.y) {
          p.y = e.y - p.h; gnd = true; p.ride = i;
          if (e.t === 'crumb' && e.st === 0) { e.st = 1; e.tm = 30; ev(S, 'crumble', e.x + 8, e.y); }
          break;
        }
      }
    }
  }
  if (gnd) {
    if (!wasG && vyIn > 2) ev(S, 'land', p.x + p.w / 2, p.y + p.h, vyIn);
    p.vy = 0; p.coy = PH.coyote; S.combo = 0;
  } else if (p.coy > 0) p.coy--;
  p.ground = gnd;

  if (p.inv === 0 && !S.won) {
    const x0 = Math.floor((p.x + 2) / T), x1 = Math.floor((p.x + p.w - 2.01) / T);
    const y0 = Math.floor(p.y / T), y1 = Math.floor((p.y + p.h - 0.01) / T);
    outer:
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      if (tileAt(L, tx, ty) === SPIKE && p.y + p.h > ty * T + 7) {
        if (hurt(S, tx * T + 8 + (p.vx >= 0 ? 4 : -4)) && !p.dead) p.vy = -3.2;
        break outer;
      }
    }
  }
  if (!p.dead && p.y > L.h * T + 48) {
    p.hp = 0; p.dead = 45; p.vy = 0;
    ev(S, 'die', p.x + 5, L.h * T);
  }
}

/* ---------- everything else ---------- */
function touch(S, e, inp, stompable) {
  const p = S.p;
  if (p.dead || S.won || e.dead || !hit(p, e)) return;
  if (stompable && p.vy > 0 && p.y + p.h - p.vy <= e.y + e.h * 0.6 + 1.5) {
    e.dead = 1; e.vy = 0;
    S.combo++;
    p.vy = -(inp.j ? 4.9 : 3.1) * S.nj;
    p.spring = inp.j ? 0 : 9;
    p.y = e.y - p.h; p.ground = false;
    addPearls(S, Math.min(S.combo, 5));
    ev(S, 'stomp', e.x + e.w / 2, e.y + e.h / 2, S.combo);
  } else hurt(S, e.x + e.w / 2);
}

function step(S, L, inp) {
  const p = S.p, E = S.ents;
  S.f++;
  if (S.won) S.won++;
  else if (!p.dead) S.time++;

  // moving things first so the player can ride them
  for (let i = 0; i < E.length; i++) {
    const e = E[i];
    if (!e) continue;
    if (e.t === 'plat') {
      const k = 0.5 - 0.5 * Math.cos(S.f * e.w0);
      const nx = e.ax + e.rx * k, ny = e.ay + e.ry * k;
      e.dx = nx - e.x; e.dy = ny - e.y; e.py = e.y; e.x = nx; e.y = ny;
    } else if (e.t === 'crumb') {
      e.py = e.y;
      if (e.st === 1) { if (--e.tm <= 0) { e.st = 2; e.vy = 0; e.tm = 210; ev(S, 'crumbfall', e.x + 8, e.y); } }
      else if (e.st === 2) {
        e.vy = Math.min(e.vy + 0.3, 5); e.y += e.vy;
        if (--e.tm <= 0) {
          if (p.x < e.ax + 16 && p.x + p.w > e.ax && p.y < e.ay + 8 && p.y + p.h > e.ay) e.tm = 20;
          else { e.st = 0; e.y = e.ay; e.py = e.ay; e.vy = 0; }
        }
      }
    }
  }

  stepPlayer(S, L, inp);

  const alive = !p.dead && !S.won;
  const bottom = L.h * T;
  for (let i = 0; i < E.length; i++) {
    const e = E[i];
    if (!e) continue;
    switch (e.t) {
      case 'pearl':
        if (alive && hit(p, e)) { S.got[i] = 1; E[i] = null; addPearls(S, 1); ev(S, 'pearl', e.x + 4, e.y + 4); }
        break;
      case 'bub':
        if (alive && hit(p, e)) {
          S.got[i] = 1; E[i] = null;
          if (e.k === 2) { S.lives++; ev(S, 'oneup', e.x + 7, e.y + 7); }
          else if (e.k === 1 && p.hp < 3) { p.hp++; ev(S, 'heart', e.x + 7, e.y + 7); }
          else { addPearls(S, 5); ev(S, 'pop', e.x + 7, e.y + 7, 5); }
        }
        break;
      case 'lotus':
        if (alive && hit(p, e)) { S.got[i] = 1; E[i] = null; S.lotus |= (1 << e.n); ev(S, 'lotus', e.x + 7, e.y + 7, e.n); }
        break;
      case 'check':
        if (alive && e.n > S.cp && hit(p, e)) {
          S.cp = e.n; p.cpx = e.x + 1; p.cpy = e.y + e.h - p.h;
          if (p.hp < 3) p.hp = 3;
          ev(S, 'check', e.x + 6, e.y + 6);
        }
        break;
      case 'goal':
        if (alive && hit(p, e)) { S.won = 1; p.vx *= 0.3; ev(S, 'bell', e.x + 14, e.y + 16); }
        break;
      case 'bud':
        if (e.an > 0) e.an--;
        if (alive && p.vy > 0 && hit(p, e) && p.y + p.h - p.vy <= e.y + 6) {
          p.vy = -(inp.j ? 6.5 : 6.0) * S.nj; p.spring = 45; p.ground = false; p.coy = 0;
          p.y = e.y - p.h; e.an = 16; S.combo = 0;
          ev(S, 'boing', e.x + 7, e.y);
        }
        break;
      case 'crab':
        if (e.dead) { if (++e.dead > 22) E[i] = null; break; }
        if (!e.on) { if (Math.abs(e.x - p.x) < 270) e.on = 1; else break; }
        e.vy = Math.min(e.vy + 0.3, 4.5);
        if (moveX(L, e, e.vx)) e.vx = -e.vx;
        if (moveY(L, e, e.vy) === 1) {
          e.vy = 0;
          if (e.smart) {
            const fx = e.vx > 0 ? e.x + e.w + 1 : e.x - 1;
            const b = tileAt(L, Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T));
            if (!solid(b) && b !== PLANK) e.vx = -e.vx;
          }
        }
        if (e.y > bottom + 40) { E[i] = null; break; }
        touch(S, e, inp, true);
        break;
      case 'hop': {
        if (e.dead) { if (++e.dead > 22) E[i] = null; break; }
        if (!e.on) { if (Math.abs(e.x - p.x) < 270) e.on = 1; else break; }
        e.vy = Math.min(e.vy + 0.25, 4.5);
        if (e.vx && moveX(L, e, e.vx)) e.vx = -e.vx;
        const r = moveY(L, e, e.vy);
        if (r === 1) { e.vy = 0; e.vx = 0; e.g = 1; } else { e.g = 0; if (r === -1) e.vy = 0; }
        if (e.g && --e.tm <= 0) {
          const d = (p.x + p.w / 2 < e.x + e.w / 2) ? -1 : 1;
          e.face = d; e.vx = d * 1.15; e.vy = -3.9; e.g = 0;
          e.tm = 50 + ((rnd(S) * 40) | 0);
        }
        if (e.y > bottom + 40) { E[i] = null; break; }
        touch(S, e, inp, true);
        break;
      }
      case 'skeet': {
        if (e.dead) { e.dead++; e.y += e.dead * 0.2; if (e.dead > 30) E[i] = null; break; }
        const a = S.f * 0.021 + e.ph;
        e.x = e.ax + Math.sin(a) * e.rx;
        e.y = e.ay + Math.sin(S.f * 0.08 + e.ph) * 4;
        e.face = Math.cos(a) >= 0 ? 1 : -1;
        touch(S, e, inp, true);
        break;
      }
      case 'urch':
        if (e.ry) e.y = e.ay + Math.sin(S.f * 0.028 + e.ph) * e.ry;
        touch(S, e, inp, false);
        break;
      case 'puff': {
        const a = S.f * 0.024 + e.ph;
        e.x = e.ax + Math.sin(a) * e.rx;
        e.y = e.ay + Math.sin(S.f * 0.05 + e.ph) * 2;
        e.face = Math.cos(a) >= 0 ? 1 : -1;
        touch(S, e, inp, false);
        break;
      }
      case 'drip':
        if (e.st === 0) {
          const dx = (p.x + p.w / 2) - (e.x + 4);
          if (alive && Math.abs(dx) < 26 && p.y > e.y && p.y - e.y < 150) { e.st = 1; e.tm = 20; ev(S, 'creak', e.x + 4, e.y); }
        } else if (e.st === 1) { if (--e.tm <= 0) e.st = 2; }
        else {
          e.vy = Math.min(e.vy + 0.32, 5.5);
          if (moveY(L, e, e.vy, true) === 1 || e.y > bottom + 20) { ev(S, 'crash', e.x + 4, e.y + e.h); E[i] = null; break; }
          touch(S, e, inp, false);
        }
        break;
      case 'leap':
        if (e.dead) { e.dead++; e.vy += 0.25; e.y += e.vy; if (e.dead > 50) E[i] = null; break; }
        if (++e.tm >= e.per) { e.tm = 0; e.y = bottom + 6; e.vy = -e.pow; ev(S, 'leap', e.x + 5, bottom); }
        if (e.vy < 0 || e.y < bottom + 14) { e.vy += 0.15; e.y += e.vy; }
        if (e.y < bottom + 4) touch(S, e, inp, true);
        break;
    }
  }
}

/* ===== gfx: every pixel in the game is generated here ===== */
function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function g2(c) { const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return g; }
function hash2(x, y, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul((s | 0) + 1, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

const SPR = {};
function art(name, pal, text) {
  const rows = text.trim().split('\n').map(function (r) { return r.trim(); });
  const h = rows.length, w = rows[0].length;
  const c = cv(w, h), g = g2(c);
  for (let y = 0; y < h; y++) {
    if (rows[y].length !== w) throw new Error('sprite ' + name + ' row ' + y + ' is ' + rows[y].length + ' wide, want ' + w);
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === '.') continue;
      const col = pal[ch];
      if (!col) throw new Error('sprite ' + name + ': no colour for "' + ch + '"');
      g.fillStyle = col; g.fillRect(x, y, 1, 1);
    }
  }
  SPR[name] = c;
  return c;
}
function flipped(c) {
  if (!c._f) { const f = cv(c.width, c.height), g = g2(f); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); c._f = f; }
  return c._f;
}
function rowsOf(text) { return text.trim().split('\n').map(function (r) { return r.trim(); }); }

const FONT = {};
(function () {
  for (const ch in FONT_SRC) {
    const rows = FONT_SRC[ch].split('/');
    if (rows.length !== 7) throw new Error('glyph ' + ch + ' has ' + rows.length + ' rows');
    const w = rows[0].length, runs = [];
    for (let y = 0; y < 7; y++) {
      if (rows[y].length !== w) throw new Error('glyph ' + ch + ' row ' + y);
      let x = 0;
      while (x < w) {
        if (rows[y][x] === '#') { let n = 1; while (x + n < w && rows[y][x + n] === '#') n++; runs.push(x, y, n); x += n; }
        else x++;
      }
    }
    FONT[ch] = { w: w, runs: runs };
  }
})();
function glyph(ch) { return FONT[ch] || FONT[ch.toUpperCase()] || FONT['?']; }
function textW(s, sc) {
  sc = sc || 1; let w = 0;
  for (let i = 0; i < s.length; i++) w += (glyph(s[i]).w + 1) * sc;
  return w - sc;
}
function text(g, s, x, y, col, sc) {
  sc = sc || 1; g.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const gl = glyph(s[i]), r = gl.runs;
    for (let j = 0; j < r.length; j += 3) g.fillRect(x + r[j] * sc, y + r[j + 1] * sc, r[j + 2] * sc, sc);
    x += (gl.w + 1) * sc;
  }
  return x;
}
function textS(g, s, x, y, col, sc, sh) { // with drop shadow
  sc = sc || 1;
  text(g, s, x + sc, y + sc, sh || '#0b1026', sc);
  return text(g, s, x, y, col, sc);
}
function textC(g, s, cx, y, col, sc, sh) { return textS(g, s, Math.round(cx - textW(s, sc) / 2), y, col, sc, sh); }
function textO(g, s, x, y, col, sc, oc) { // with full outline
  sc = sc || 1;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) text(g, s, x + dx * sc, y + dy * sc, oc, sc);
  text(g, s, x, y + 2 * sc, oc, sc);
  return text(g, s, x, y, col, sc);
}

/* ---------- procedural tiles ---------- */
const tileCache = {};
function groundTile(thName, mask, v) { // mask bits: 1 open above, 2 right, 4 below, 8 left
  const key = thName + 'g' + mask + '_' + v;
  if (tileCache[key]) return tileCache[key];
  const th = THEMES[thName], so = th.soil, gr = th.grass;
  const c = cv(16, 16), g = g2(c);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const n = hash2(x, y, v * 7 + 3);

    if (n.v === 'k') { musTone('sine', 150, 46, 0.13, 0.34, t); }
    else if (n.v === 's') { musNoise(0.09, 0.11, t, 'bandpass', 1900); musTone('triangle', 200, 130, 0.05, 0.12, t); }
    else if (n.v === 'h') { musNoise(0.03, 0.045, t, 'highpass', 7000); }

}

function stepFX() {
  FX.tick++;

    const p = P[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--;

/* ---------- the world ---------- */
function spr(c, x, y, flip) { g.drawImage(flip ? flipped(c) : c, Math.round(x), Math.round(y)); }

function drawEnts(S, L, cx, cy) {

    const x = e.x - cx, y = e.y - cy;
    switch (e.t) {
      case 'pearl': spr(((f >> 4) + (e.x >> 4)) & 1 ? SPR.pearl1 : SPR.pearl2, x, y + Math.sin(f * 0.08 + e.x * 0.05)); break;
      case 'bub': {

function drawWater(L, cx, cy) {

    if (tx === W - 1 || L.tiles[ty * W + tx + 1] !== WATER) g.fillRect(bx + T - 1, by, 1, T);
    if (ty + 1 < L.h && !F[(ty + 1) * W + tx]) {

function storeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }

/* ---------- input ---------- */
const INPUT = { l: false, r: false, j: false, d: false, touch: false, kb: false };
const KEYS = {};
const TP = { l: false, r: false, j: false };
const PRESS = { l: false, r: false, u: false, d: false, j: false, pause: false };
let prevIn = { l: false, r: false, u: false, d: false, j: false, s: false };
let tapPulse = 0, pauseReq = false, HOLD = false;

function pollInput() {
  let gl = false, gr = false, gj = false, gd = false, gu = false, gs = false;
  try {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < pads.length; i++) {
      const pad = pads[i];
      if (!pad) continue;
      const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
      const b = function (n) { return pad.buttons[n] && pad.buttons[n].pressed; };
      if (ax < -0.4 || b(14)) gl = true;
      if (ax > 0.4 || b(15)) gr = true;
      if (ay > 0.55 || b(13)) gd = true;
      if (ay < -0.6 || b(12)) gu = true;
      if (b(0) || b(1) || b(2) || b(3)) gj = true;
      if (b(9)) gs = true;
    }
  } catch (e) {}
  const l = !!(KEYS.ArrowLeft || KEYS.KeyA || TP.l || gl), r = !!(KEYS.ArrowRight || KEYS.KeyD || TP.r || gr);
  const u = !!(KEYS.ArrowUp || KEYS.KeyW || gu), d = !!(KEYS.ArrowDown || KEYS.KeyS || gd);
  const jb = !!(KEYS.Space || KEYS.KeyZ || KEYS.KeyX || KEYS.KeyK || KEYS.Enter || TP.j || gj || tapPulse > 0);
  if (tapPulse > 0) tapPulse--;
  PRESS.l = l && !prevIn.l; PRESS.r = r && !prevIn.r; PRESS.u = u && !prevIn.u; PRESS.d = d && !prevIn.d;
  PRESS.j = jb && !prevIn.j;
  PRESS.pause = pauseReq || (gs && !prevIn.s);
  pauseReq = false;
  prevIn = { l: l, r: r, u: u, d: d, j: jb, s: gs };
  INPUT.l = l; INPUT.r = r; INPUT.d = d; INPUT.j = jb || u;
}

/* ---------- game state ---------- */
const GM = { mode: 'boot', t: 0, lv: 0, L: null, S: null, sel: 0, psel: 0, paused: false, fade: 0, lives: 3, pearls: 0, tally: null, hint: null, hintA: 0, deaths: 0 };

function snapCam() { updCam(true); }
function updCam(snap) {
  const S = GM.S, L = GM.L, p = S.p;
  if (p.dead && !snap) return;
  const maxX = Math.max(0, L.w * T - V.w), maxY = L.h * T - V.h;
  cam.lx = snap ? p.face * V.w * 0.1 : lerp(cam.lx, p.face * V.w * 0.1, 0.035);
  const tx = clamp(p.x + p.w / 2 - V.w / 2 + cam.lx, 0, maxX);
  cam.x = snap ? tx : lerp(cam.x, tx, 0.16);
  const pc = p.y + p.h / 2;
  let ty = snap ? pc - V.h * 0.72 : cam.ty;
  if (pc < ty + V.h * 0.3) ty = pc - V.h * 0.3;
  else if (pc > ty + V.h * 0.72) ty = pc - V.h * 0.72;
  cam.ty = maxY <= 0 ? maxY : clamp(ty, 0, maxY);
  cam.y = snap ? cam.ty : lerp(cam.y, cam.ty, 0.14);
}
function clearFX() { FX.parts.length = 0; FX.pops.length = 0; FX.sq = 0; FX.bell = 0; FX.bolt = 0; cam.shake = 0; }

function toTitle() {
  GM.mode = 'title'; GM.t = 0; GM.paused = false;
  GM.L = TITLE_L; GM.S = newState(TITLE_L, {});
  GM.sel = clamp(SAVE.un - 1, 0, LEVELS.length - 1);
  clearFX(); snapCam(); GM.fade = 1;
  musVol(0.34); playSong(4);
}
function startGame(i) { GM.lives = 3; GM.pearls = 0; GM.deaths = 0; sfx('start'); beginLevel(i); }
function beginLevel(i) {
  GM.lv = i; GM.L = LEVELS[i];
  GM.S = newState(GM.L, { lives: GM.lives, pearls: GM.pearls });
  GM.mode = 'intro'; GM.t = 0; GM.paused = false; GM.hint = null; GM.hintA = 0; GM.tally = null;
  clearFX(); snapCam(); stopSong(); musVol(0.34);
}
function setPause(on) {
  if (GM.mode !== 'play') return;
  if (on === GM.paused) return;
  GM.paused = on; GM.psel = 0;
  musVol(on ? 0.1 : 0.34);
  sfx('pause');
  syncButtons();
}
function finishLevel() {
  const S = GM.S, b = SAVE.best[GM.lv] || { t: 0, l: 0 };
  const newBest = !b.t || S.time < b.t;
  GM.tally = { pearls: S.lvPearls, lotus: S.lotus, time: S.time, newBest: newBest && !!b.t };
  SAVE.best[GM.lv] = { t: newBest ? S.time : b.t, l: (b.l | 0) | S.lotus };
  SAVE.un = clamp(Math.max(SAVE.un, GM.lv + 2), 1, LEVELS.length);
  storeSave();
}
function totalLotus() {
  let n = 0, all = 0;
  for (let i = 0; i < LEVELS.length; i++) {
    all += LEVELS[i].nLotus;
    const b = SAVE.best[i];
    if (b) for (let k = 0; k < LEVELS[i].nLotus; k++) if ((b.l >> k) & 1) n++;
  }
  return [n, all];
}

/* ---------- effects for sim events ---------- */
function handleEvents(S, L) {

  for (let i = 0; i < E.length; i++) {
    const e = E[i], near = e.x > cam.x - 40 && e.x < cam.x + V.w + 40;
    switch (e.k) {
      case 'jump': sfx('jump'); FX.sq = -7; part(e.x - 3, e.y - 1, -0.5, -0.2, 12, '#ffffff', 1, 0); part(e.x + 3, e.y - 1, 0.5, -0.2, 12, '#ffffff', 1, 0); break;
      case 'land': FX.sq = 6; if (e.v > 3) sfx('land'); part(e.x - 4, e.y - 1, -0.6, -0.25, 12, '#ffffff', 1, 0); part(e.x + 4, e.y - 1, 0.6, -0.25, 12, '#ffffff', 1, 0); break;
      case 'stomp': sfx('stomp', e.v); burst(e.x, e.y, 9, ['#ffffff', '#ffe27a', '#ff8a3c'], 1.6, 26); popText(e.x, e.y - 12, '+' + Math.min(e.v, 5), '#ffe27a'); cam.shake = 3; FX.sq = -5; break;
      case 'pearl': sfx('pearl'); burst(e.x, e.y, 4, ['#ffffff', '#9ccdf5'], 0.9, 16, 0); break;
      case 'pop': sfx('pop'); burst(e.x, e.y, 11, ['#ffffff', '#c9f2ff', '#9ccdf5'], 1.5, 22, 0.02); popText(e.x, e.y - 10, '+5', '#c9f2ff'); break;
      case 'heart': sfx('heart'); burst(e.x, e.y, 10, ['#ff4f6a', '#ffd0d8'], 1.4, 26, 0.02); popText(e.x, e.y - 10, '+1 HEART', '#ff9db0'); break;
      case 'oneup': sfx('oneup'); popText(e.x, e.y - 12, '1UP!', '#b8f08a'); burst(e.x, e.y, 12, ['#8fe06a', '#ffffff'], 1.6, 28, 0.02); break;
      case 'lotus': {
        let n = 0; for (let k = 0; k < L.nLotus; k++) if ((S.lotus >> k) & 1) n++;
        sfx('lotus'); burst(e.x, e.y, 18, ['#ffffff', '#ffb0d0', '#ffd95a'], 2, 34, 0.01); popText(e.x, e.y - 14, 'LOTUS ' + n + '/' + L.nLotus, '#ffc4dc');
        break;
      }
      case 'hurt': sfx('hurt'); cam.shake = 6; burst(e.x, e.y, 8, ['#ffc4d6', '#ffffff'], 1.5, 20); break;
      case 'die': sfx('die'); stopSong(); cam.shake = 7; break;
      case 'check': sfx('check'); burst(e.x, e.y, 14, ['#ffe27a', '#ffffff'], 1.5, 30, 0.01); popText(e.x, e.y - 16, 'CHECKPOINT', '#ffe27a'); break;
      case 'bell': sfx('bell'); FX.bell = 130; burst(e.x, e.y + 6, 22, ['#ffd95a', '#ffffff'], 2, 40, 0.02); break;
      case 'boing': sfx('boing'); FX.sq = -7; break;
      case 'splash': sfx('splash'); for (let k = 0; k < 9; k++) part(e.x + (Math.random() - 0.5) * 12, e.y - 5, (Math.random() - 0.5) * 1.8, -1.2 - Math.random() * 1.6, 26, '#e6fdff', 1, 0.12); break;
      case 'splashout': sfx('splashout'); for (let k = 0; k < 6; k++) part(e.x + (Math.random() - 0.5) * 10, e.y + 4, (Math.random() - 0.5) * 1.4, -1 - Math.random(), 22, '#e6fdff', 1, 0.12); break;
      case 'swim': sfx('swim'); part(e.x + (Math.random() - 0.5) * 6, e.y, (Math.random() - 0.5) * 0.3, -0.35, 34, '#e6fdff', 1, -0.006); break;
      case 'crumble': sfx('crumble'); break;
      case 'crumbfall': if (near) { sfx('crumbfall'); burst(e.x, e.y + 4, 5, THEMES[L.theme].crumb, 0.8, 20); } break;
      case 'creak': if (near) sfx('creak'); break;
      case 'crash': if (near) { sfx('crash'); burst(e.x, e.y, 10, ['#6f84c4', '#b4c4f0', '#3a4675'], 1.7, 24); cam.shake = 3; } break;
      case 'leap': if (near) { sfx('leap'); for (let k = 0; k < 4; k++) part(e.x + (Math.random() - 0.5) * 8, e.y - 2, (Math.random() - 0.5), -1.5 - Math.random(), 22, '#e6fdff', 1, 0.12); } break;
    }
  }
  E.length = 0;
}
function fxPlayer(S) {
  const p = S.p;
  if (p.dead) return;
  if (p.ground) {
    FX.walk += Math.abs(p.vx);
    if (p.run > 55 && (S.f % 5) === 0) part(p.x + 5 - p.face * 5, p.y + 13, -p.face * 0.3, -0.25, 14, '#ffffff', 1, 0);
    if (((INPUT.r && p.vx < -0.8) || (INPUT.l && p.vx > 0.8)) && (S.f % 3) === 0) part(p.x + 5 + sign(p.vx) * 5, p.y + 13, sign(p.vx) * 0.5, -0.4, 14, '#ffffff', 1, 0);
  }
  if (p.water && (S.f % 26) === 0) part(p.x + 5 + p.face * 4, p.y + 3, 0, -0.3, 36, '#e6fdff', 1, -0.006);
}

/* ---------- hints ---------- */
function hintText(k) {
  const kb = INPUT.kb || !INPUT.touch;
  if (k === 'move') return kb ? 'ARROWS OR A/D TO RUN. SPACE TO JUMP - HOLD IT TO GO HIGHER.' : 'HOLD < OR > TO RUN. TAP JUMP - HOLD IT TO GO HIGHER.';
  if (k === 'swim') return (kb ? 'IN WATER, TAP SPACE TO SWIM UP.' : 'IN WATER, TAP JUMP TO SWIM UP.') + ' PLANKS KEEP YOU DRY.';
  if (k === 'bud') return 'LAND ON A BOUNCE BUD. HOLD JUMP TO FLY HIGHER.';
  if (k === 'dive') return 'THE WAY ON IS UNDER THE WALL. DIVE!';
  if (k === 'crumb') return 'CRACKED SLABS FALL AWAY. KEEP MOVING!';
  if (k === 'lift') return 'RIDE THE PAD UP.';
  if (k === 'stomp') return 'JUMP ON CRITTERS TO SQUASH THEM. NOT THE SPIKY ONES!';
  if (k === 'falls') return kb ? 'SWIM UP THE WATERFALL - KEEP TAPPING SPACE!' : 'SWIM UP THE WATERFALL - KEEP TAPPING JUMP!';
  return k;
}
function wrap(s, maxW) {
  const words = s.split(' '), lines = [];
  let cur = '';
  for (let i = 0; i < words.length; i++) {
    const t = cur ? cur + ' ' + words[i] : words[i];
    if (textW(t) > maxW && cur) { lines.push(cur); cur = words[i]; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function updHint() {
  const L = GM.L, tx = (GM.S.p.x + 5) / T;
  let h = null;
  for (let i = 0; i < L.hints.length; i++) { const q = L.hints[i]; if (tx >= q.x && tx <= q.x + q.w) h = q; }
  if (h) { GM.hint = h.k; GM.hintA = Math.min(1, GM.hintA + 0.08); } else GM.hintA = Math.max(0, GM.hintA - 0.05);
}
function panel(x, y, w, h, c) {
  g.fillStyle = c || 'rgba(8,16,40,0.78)';
  g.fillRect(x + 1, y, w - 2, h); g.fillRect(x, y + 1, 1, h - 2); g.fillRect(x + w - 1, y + 1, 1, h - 2);
}
function drawHint() {
  if (GM.hintA <= 0 || !GM.hint) return;
  const lines = wrap(hintText(GM.hint), V.w - 28);
  let w = 0;
  for (let i = 0; i < lines.length; i++) w = Math.max(w, textW(lines[i]));
  const h = lines.length * 10 + 6, x = Math.round((V.w - w) / 2) - 6, y = 20;
  g.globalAlpha = GM.hintA;
  panel(x, y, w + 12, h);
  for (let i = 0; i < lines.length; i++) text(g, lines[i], Math.round((V.w - textW(lines[i])) / 2), y + 4 + i * 10, '#ffffff');
  g.globalAlpha = 1;
}

/* ---------- update ---------- */
function update() {
  pollInput();
  GM.t++;
  const S = GM.S, L = GM.L;
  switch (GM.mode) {
    case 'title': {
      const ti = { l: false, r: false, j: (GM.t % 210) > 150 && (GM.t % 210) < 170, d: false };
      step(S, L, ti); S.ev.length = 0;
      if (GM.t === 1) snapCam();
      cam.x = clamp(L.w * T / 2 - V.w / 2, 0, Math.max(0, L.w * T - V.w));
      if (SAVE.un > 1) {
        if (PRESS.l) { GM.sel = (GM.sel + SAVE.un - 1) % SAVE.un; sfx('select'); }
        if (PRESS.r) { GM.sel = (GM.sel + 1) % SAVE.un; sfx('select'); }
      }
      if (PRESS.j && GM.t > 20) startGame(GM.sel);
      break;
    }
    case 'intro':
      if (GM.t > 130 || (GM.t > 36 && PRESS.j)) { GM.mode = 'play'; GM.t = 0; GM.fade = 1; playSong(L.song); }
      break;
    case 'play':
      if (PRESS.pause) { setPause(!GM.paused); break; }
      if (GM.paused) {
        if (PRESS.l || PRESS.u) { GM.psel = (GM.psel + 2) % 3; sfx('select'); }
        if (PRESS.r || PRESS.d) { GM.psel = (GM.psel + 1) % 3; sfx('select'); }
        if (PRESS.j) {
          const c = GM.psel;
          setPause(false);
          if (c === 1) { GM.lives = 3; GM.pearls = 0; beginLevel(GM.lv); }
          else if (c === 2) toTitle();
        }
        break;
      }
      step(S, L, INPUT);
      handleEvents(S, L);
      fxPlayer(S);
      updCam(false);
      updHint();
      if (L.rain && --FX.nextBolt <= 0) { FX.bolt = 16; FX.nextBolt = 300 + Math.random() * 420; sfx('thunder'); }
      if (S.lost) {
        S.lives--; GM.deaths++;
        if (S.lives <= 0) { GM.mode = 'over'; GM.t = 0; stopSong(); sfx('over'); }
        else { respawn(S, L); clearFX(); snapCam(); GM.fade = 1; playSong(L.song); }
      } else if (S.won === 1) { GM.mode = 'clear'; GM.t = 0; stopSong(); sfx('clear'); finishLevel(); }
      break;
    case 'clear':
      step(S, L, NOIN);
      handleEvents(S, L);
      if (S.p.ground && GM.t > 30 && (GM.t % 44) === 0 && GM.t < 400) { S.p.vy = -3.2; S.p.ground = false; }
      updCam(false);
      if (GM.t > 150 && GM.t < 260 && (GM.t % 6) === 0) sfx('tick');
      if (GM.t > 200 && PRESS.j) {
        GM.lives = S.lives; GM.pearls = S.pearls;
        if (GM.lv + 1 < LEVELS.length) beginLevel(GM.lv + 1);
        else { GM.mode = 'ending'; GM.t = 0; GM.L = TITLE_L; GM.S = newState(TITLE_L, {}); clearFX(); snapCam(); GM.fade = 1; playSong(4); }
      }
      break;
    case 'over':
      if (GM.t > 70 && PRESS.j) { GM.lives = 3; GM.pearls = 0; beginLevel(GM.lv); }
      break;
    case 'ending': {
      const ti = { l: false, r: false, j: (GM.t % 90) < 12, d: false };
      step(S, L, ti); S.ev.length = 0;
      cam.x = clamp(L.w * T / 2 - V.w / 2, 0, Math.max(0, L.w * T - V.w));
      if ((GM.t % 16) === 0) burst(cam.x + Math.random() * V.w, cam.y + 20 + Math.random() * V.h * 0.4, 10, ['#ffe27a', '#ff8fb2', '#8ff0dd', '#ffffff'], 1.8, 40, 0.03);
      if (GM.t > 150 && PRESS.j) toTitle();
      break;
    }
  }
  if (!(GM.mode === 'play' && GM.paused)) stepFX();
  if (GM.fade > 0) GM.fade = Math.max(0, GM.fade - 0.05);
}

/* ---------- screens ---------- */
function drawLogo(cx, y, sc) {
  const lines = ['LAGOON', 'LEAP'], cols = ['#ffe27a', '#ff9dbd'];
  for (let n = 0; n < 2; n++) {
    const s = lines[n];
    let x = Math.round(cx - textW(s, sc) / 2);
    for (let i = 0; i < s.length; i++) {
      const bob = REDUCED ? 0 : Math.round(Math.sin(GM.t * 0.07 + i * 0.7 + n * 1.9) * 2);
      const drop = Math.max(0, 30 - (GM.t - (n * 6 + i) * 4) * 3);
      textO(g, s[i], x, y + n * (9 * sc) + bob - (REDUCED ? 0 : drop), cols[n], sc, '#16264f');
      // glossy top half
      g.save(); g.beginPath(); g.rect(x, y + n * (9 * sc) + bob - (REDUCED ? 0 : drop), 6 * sc, 3 * sc); g.clip();
      text(g, s[i], x, y + n * (9 * sc) + bob - (REDUCED ? 0 : drop), '#ffffff', sc); g.restore();
      x += (glyph(s[i]).w + 1) * sc;
    }
  }
}
function prompt(cx, y, kbTxt, tpTxt) {
  if ((GM.t >> 5) & 1) return;

  for (let n = 0; n < L.nLotus; n++) g.drawImage(((ta.lotus >> n) & 1) && k > (n + 1) / 4 ? SPR.lotus_s : SPR.lotus_s0, x + w - 10 - (L.nLotus - n) * 11, y + 21);
  textS(g, 'TIME', x + 10, y + 36, '#ffe27a'); const ts = fmtTime(Math.round(ta.time * k)); textS(g, ts, x + w - 10 - textW(ts), y + 36, '#ffffff');
  if (k >= 1 && ta.newBest) textC(g, 'NEW BEST TIME!', cx, y + 49, '#b8f08a', 1, '#0b1026');
  if (t > 200) prompt(cx, y + 72, 'PRESS SPACE', 'TAP JUMP');
}
function drawOver() {
  g.fillStyle = 'rgba(6,10,28,' + clamp(GM.t / 60, 0, 0.72) + ')'; g.fillRect(0, 0, V.w, V.h);
  const cx = Math.round(V.w / 2), cy = Math.round(V.h / 2);
  textC(g, 'GAME OVER', cx, cy - 24, '#ff9dbd', 2, '#0b1026');
  textC(g, 'MOCHI NEEDS A BREATHER', cx, cy + 2, '#ffffff', 1, '#0b1026');
  if (GM.t > 70) prompt(cx, cy + 22, 'PRESS SPACE TO TRY AGAIN', 'TAP JUMP TO TRY AGAIN');
}
function drawEnding() {
  const cx = Math.round(V.w / 2), y = Math.round(V.h * 0.12), tl = totalLotus();
  textC(g, 'YOU DID IT!', cx, y, '#ffe27a', V.w >= 300 ? 3 : 2, '#16264f');
  const y2 = y + (V.w >= 300 ? 32 : 24);
  const w = Math.min(V.w - 16, 230);
  panel(Math.round(cx - w / 2), y2, w, 62);
  textC(g, 'THE GREAT BELL RINGS AND THE', cx, y2 + 7, '#ffffff', 1, '#0b1026');
  textC(g, 'LAGOON GLOWS AGAIN.', cx, y2 + 18, '#ffffff', 1, '#0b1026');
  textC(g, 'LOTUS FOUND  ' + tl[0] + '/' + tl[1], cx, y2 + 34, '#ffc4dc', 1, '#0b1026');
  textC(g, tl[0] < tl[1] ? 'CAN YOU FIND THEM ALL?' : 'EVERY LAST ONE. AMAZING!', cx, y2 + 46, '#c9f2ff', 1, '#0b1026');
  if (GM.t > 150) prompt(cx, y2 + 74, 'PRESS SPACE', 'TAP JUMP');
}
function render() {
  const S = GM.S, L = GM.L;
  if (!S) return;
  if (GM.mode === 'intro') drawIntro();
  else {
    drawWorld(S, L, INPUT);
    if (GM.mode === 'title') drawTitle();
    else if (GM.mode === 'ending') drawEnding();
    else {
      drawHUD(S, L);
      if (GM.mode === 'play') { drawHint(); if (GM.paused) drawPause(); }
      else if (GM.mode === 'clear') drawClear();
      else if (GM.mode === 'over') drawOver();
    }
  }
  if (GM.fade > 0) { g.fillStyle = 'rgba(6,10,28,' + GM.fade.toFixed(3) + ')'; g.fillRect(0, 0, V.w, V.h); }
}

/* ---------- page plumbing ---------- */
const elApp = document.getElementById('app'), elScreen = document.getElementById('screen'), elDeck = document.getElementById('deck');
const elL = document.getElementById('kL'), elR = document.getElementById('kR'), elJ = document.getElementById('kJ');
const bSound = document.getElementById('bSound'), bPause = document.getElementById('bPause');

function layout() {
  const cs = getComputedStyle(elApp);
  const W = elApp.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const H = elApp.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (W < 20 || H < 20) return;
  const portrait = INPUT.touch && H > W * 1.05;
  document.body.classList.toggle('touch', INPUT.touch);
  document.body.classList.toggle('portrait', portrait);
  const bw = W, bh = portrait ? Math.max(120, Math.min(Math.round(W * 0.84), H - 200)) : H;
  elScreen.style.height = portrait ? bh + 'px' : '';
  const dpr = Math.min(window.devicePixelRatio || 1, 4);
  const dw = bw * dpr, dh = bh * dpr;
  let s = Math.max(1, Math.floor(dh / 208));
  while (s > 1 && dw / s < 232) s--;
  const vw = clamp(Math.floor(dw / s), 160, 480), vh = clamp(Math.floor(dh / s), 120, 240);
  if (canvas.width !== vw || canvas.height !== vh) { canvas.width = vw; canvas.height = vh; }
  canvas.style.width = (vw * s / dpr) + 'px'; canvas.style.height = (vh * s / dpr) + 'px';
  g.imageSmoothingEnabled = false;
  V.w = vw; V.h = vh; V.s = s;
  // keep the HUD clear of the corner buttons when they float over the picture
  const cssPer = s / dpr, sideGap = (bw - vw * cssPer) / 2;
  const sysEl = document.getElementById('sys'), sysW = sysEl && sysEl.offsetWidth ? sysEl.offsetWidth + 16 : 104;
  V.rsv = portrait ? 0 : Math.max(0, Math.ceil((sysW - sideGap) / cssPer));
  document.documentElement.style.setProperty('--screen-h', bh + 'px');
  if (GM.S) snapCam();
}

function syncButtons() {
  bSound.classList.toggle('off', AU.muted);
  bSound.setAttribute('aria-pressed', AU.muted ? 'false' : 'true');
  bPause.classList.toggle('on', GM.paused);
}
function toggleMute() { auMute(!AU.muted); SAVE.mute = AU.muted; storeSave(); syncButtons(); }

window.addEventListener('keydown', function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const c = e.code;
  if (c === 'Tab') return;
  INPUT.kb = true;
  auResume();
  if (c === 'KeyM' && !e.repeat) { toggleMute(); return; }
  if ((c === 'KeyP' || c === 'Escape') && !e.repeat) { pauseReq = true; e.preventDefault(); return; }
  if ((c === 'Enter' || c === 'Space') && document.activeElement && document.activeElement.tagName === 'BUTTON') return;
  KEYS[c] = true;
  if (c.indexOf('Arrow') === 0 || c === 'Space') e.preventDefault();
});
window.addEventListener('keyup', function (e) { KEYS[e.code] = false; });
window.addEventListener('blur', function () { for (const k in KEYS) KEYS[k] = false; TP.l = TP.r = TP.j = false; touches.clear(); paintKeys(); });

const touches = new Map();
function paintKeys() {
  elL.classList.toggle('on', TP.l); elR.classList.toggle('on', TP.r); elJ.classList.toggle('on', TP.j);
}
function recompute() {
  let l = false, r = false, j = false;
  const rc = elDeck.getBoundingClientRect(), pr = elL.parentNode.getBoundingClientRect();
  const mid = pr.left + pr.width / 2, half = rc.left + rc.width / 2;
  touches.forEach(function (t) {
    if (t.zone === 'pad') { if (t.x < mid) l = true; else r = true; }
    else j = true;
    void half;
  });
  TP.l = l; TP.r = r; TP.j = j;
  paintKeys();
}
function useTouch() { if (!INPUT.touch) { INPUT.touch = true; layout(); } INPUT.kb = false; }
elDeck.addEventListener('pointerdown', function (e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  auResume(); useTouch();
  const rc = elDeck.getBoundingClientRect();
  const zone = e.clientX < rc.left + rc.width / 2 ? 'pad' : 'jump';
  touches.set(e.pointerId, { zone: zone, x: e.clientX });
  if (zone === 'jump') tapPulse = Math.max(tapPulse, 2); // a very quick tap still counts
  try { elDeck.setPointerCapture(e.pointerId); } catch (err) {}
  recompute();
});
elDeck.addEventListener('pointermove', function (e) {
  const t = touches.get(e.pointerId);
  if (t) { t.x = e.clientX; if (t.zone === 'pad') recompute(); }
});
function endTouch(e) { if (touches.delete(e.pointerId)) recompute(); auResume(); }
elDeck.addEventListener('pointerup', endTouch);
elDeck.addEventListener('pointercancel', endTouch);
elDeck.addEventListener('lostpointercapture', endTouch);
['touchstart', 'touchmove', 'touchend'].forEach(function (n) {
  const h = function (e) { if (n === 'touchend') auResume(); e.preventDefault(); };
  elDeck.addEventListener(n, h, { passive: false });
  canvas.addEventListener(n, h, { passive: false });
});
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
['touchend', 'pointerup', 'click', 'keydown', 'mousedown'].forEach(function (n) {
  window.addEventListener(n, function () { auResume(); }, { capture: true, passive: true });
});
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

canvas.addEventListener('pointerdown', function (e) {
  if (e.pointerType === 'touch') useTouch();
  auResume();
  try { canvas.focus({ preventScroll: true }); } catch (err) {}
  if (GM.mode !== 'play' || GM.paused) tapPulse = 3;
});
canvas.addEventListener('pointerup', function () { auResume(); });
bSound.addEventListener('click', function () { auResume(); toggleMute(); bSound.blur(); });
bPause.addEventListener('click', function () { auResume(); pauseReq = true; bPause.blur(); });
[bSound, bPause].forEach(function (b) { b.addEventListener('pointerdown', function (e) { e.stopPropagation(); }); });

document.addEventListener('visibilitychange', function () {
  if (document.hidden) { if (GM.mode === 'play' && !GM.paused) setPause(true); auSuspend(); }
  else { if (AU.ac) { try { const pr = AU.ac.resume(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {} } if (AU.el) auMedia(); }
});
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', function () { setTimeout(layout, 120); });

let lastTs = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.1) dt = 0.1;
  if (HOLD) { render(); return; }
  acc += dt;
  let n = 0;
  while (acc >= 1 / 60 && n < 5) { update(); acc -= 1 / 60; n++; }
  if (n === 5) acc = 0;
  render();
}

function start(data) {
  INPUT.touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  loadSave();
  auMute(SAVE.mute);
  layout();
  if (data && typeof data.lv === 'number' && data.mode && data.mode !== 'title' && data.mode !== 'boot') {
    GM.lives = data.lives || 3; GM.pearls = data.pearls || 0;
    beginLevel(clamp(data.lv | 0, 0, LEVELS.length - 1));
  } else toTitle();
  syncButtons();
  requestAnimationFrame(frame);
}
(function boot() {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) {
    try { hot.snapshot(function () { return { lv: GM.lv, mode: GM.mode, lives: GM.S ? GM.S.lives : 3, pearls: GM.S ? GM.S.pearls : 0 }; }); } catch (e) {}
  }
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
